name: tests

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Import smoke
        run: python -c "import app.main; import app.app_context; import app.database.models"

      - name: AppContext smoke
        shell: python
        run: |
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from app.app_context import build_context
          with TemporaryDirectory() as d:
              ctx = build_context(Path(d) / "data")
              assert ctx.db.migration_report.schema_version >= 1
              ok, detail = ctx.db.integrity_check()
              assert ok, detail
              ctx.shutdown()

      - name: Qt offscreen smoke
        shell: python
        run: |
          import os
          os.environ["QT_QPA_PLATFORM"] = "offscreen"
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from PySide6.QtWidgets import QApplication
          from app.app_context import build_context
          from app.ui.main_window import MainWindow
          app = QApplication.instance() or QApplication([])
          with TemporaryDirectory() as d:
              ctx = build_context(Path(d) / "data")
              window = MainWindow(ctx)
              window.show()
              app.processEvents()
              window.close()
              ctx.shutdown()

      - name: Full pytest
        run: python -m pytest tests/ -q
